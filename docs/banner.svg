<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="De-Armor 破甲 — Less self-defense, more results">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c130d"/>
      <stop offset="0.55" stop-color="#0a100b"/>
      <stop offset="1" stop-color="#101a11"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1c2b1d" stroke-width="1"/>
    </pattern>
    <radialGradient id="halo" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#c6ff70" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#c6ff70" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)" opacity="0.55"/>
  <rect width="1200" height="360" fill="url(#halo)"/>

  <g stroke="#c6ff70" fill="none" opacity="0.6">
    <circle cx="975" cy="180" r="118" stroke-opacity="0.28"/>
    <circle cx="975" cy="180" r="86" stroke-opacity="0.42"/>
    <circle cx="975" cy="180" r="54" stroke-opacity="0.65"/>
    <path d="M975 34v34M975 292v34M829 180h34M1087 180h34" stroke-opacity="0.5"/>
  </g>

  <g filter="url(#glow)">
    <path d="M975 102 1042 140v80l-67 38-67-38v-80z" fill="#0f1a10" stroke="#c6ff70" stroke-width="2" stroke-opacity="0.85"/>
    <path d="M940 150l24 24-13 18 25 22" fill="none" stroke="#c6ff70" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1014 144l-18 34 20 12-16 34" fill="none" stroke="#c6ff70" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <text x="72" y="86" fill="#8fa08f" font-size="14" letter-spacing="5">RESPONSE QUALITY / OFFLINE / v2</text>

    <text x="70" y="178" fill="#f2f7ee" font-size="78" font-weight="700" letter-spacing="2">DE-ARMOR</text>
    <text x="76" y="238" fill="#c6ff70" font-size="44" font-weight="700" letter-spacing="8">破甲</text>

    <text x="72" y="294" fill="#b9c7b9" font-size="17" letter-spacing="1.5">LESS SELF-DEFENSE. MORE RESULTS. CUT THE FILLER, NEVER THE FACTS.</text>
    <text x="72" y="322" fill="#6f8470" font-size="13" letter-spacing="2">FACT · CONDITION · UNCERTAINTY · BOUNDARY · DELIVERY</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12">
    <rect x="852" y="290" width="96" height="28" rx="4" fill="#0f1a10" stroke="#365038"/>
    <text x="868" y="309" fill="#c6ff70">36 TESTS</text>
    <rect x="958" y="290" width="86" height="28" rx="4" fill="#0f1a10" stroke="#365038"/>
    <text x="974" y="309" fill="#c6ff70">6 CASES</text>
    <rect x="1054" y="290" width="74" height="28" rx="4" fill="#0f1a10" stroke="#365038"/>
    <text x="1068" y="309" fill="#c6ff70">NO API</text>
  </g>

  <rect x="0" y="356" width="1200" height="4" fill="#c6ff70" opacity="0.75"/>
</svg>
